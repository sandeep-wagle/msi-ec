[package]
name = "msi_dsp_service"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "msi_dsp_service"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "process", "time"] }
log = "0.4"
env_logger = "0.11"
